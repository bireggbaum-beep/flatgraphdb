<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fertigungsatlas</title>
<style>
:root{
  --bg:#121110; --rail:#0e0d0c; --panel:#181614; --fl:#1e1c1a; --fl2:#262320; --linie:#2b2825; --linie2:#3a3632;
  --text:#ebe6e0; --gedimmt:#a39b93; --leise:#6f6861; --akzent:#f07c62; --akzent2:#ff9277; --akzentbg:rgba(240,124,98,.14);
  --wahl:#3a221d; --wahl2:#46281f; --rot:#ff6b6b; --gruen:#4fbf8a;
  --mono:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 var(--sans)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:50px 200px minmax(0,1fr) 320px;grid-template-rows:48px minmax(0,1fr);height:100vh}
.app.ohne-ins{grid-template-columns:50px 200px minmax(0,1fr) 0}
/* Leiste ganz links */
.rail{grid-row:1/3;background:var(--rail);border-right:1px solid var(--linie);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:10px}
.rail .kachel{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--akzent);background:var(--akzentbg);font:700 12px var(--mono)}
.rail .knopf{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--leise);background:none;border:0}
.rail .knopf:hover{color:var(--text);background:var(--fl)}
.rail .platz{flex:1}
/* Kopf */
.kopf{grid-column:2/5;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--linie);background:var(--bg);min-width:0}
.marke{font:700 13px var(--sans);letter-spacing:.12em;white-space:nowrap}
.marke b{color:var(--akzent);font:600 10.5px var(--mono);letter-spacing:.14em;margin-left:6px}
.etikett{font:600 10px var(--mono);letter-spacing:.14em;color:var(--leise);text-transform:uppercase;white-space:nowrap}
.k-neu{background:var(--akzent);color:#1b0f0b;border:0;border-radius:5px;padding:6px 12px;font-weight:700;white-space:nowrap}
.k-neu:hover{background:var(--akzent2)}
.sel{background:var(--fl);border:1px solid var(--linie2);border-radius:5px;padding:5px 8px;max-width:180px}
.k{background:var(--fl);border:1px solid var(--linie2);border-radius:5px;padding:5px 10px;white-space:nowrap}
.k:hover{border-color:var(--leise)}
.k.an{background:var(--akzent);border-color:var(--akzent);color:#1b0f0b;font-weight:600}
.kopf .rechts{margin-left:auto;font:12px var(--mono);color:var(--leise);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Seitenleiste */
.seite{background:var(--panel);border-right:1px solid var(--linie);overflow:auto;padding:10px 8px 20px}
.suche{display:flex;align-items:center;gap:6px;background:var(--fl);border:1px solid var(--linie2);border-radius:6px;padding:6px 8px;margin-bottom:10px}
.suche input{background:none;border:0;outline:0;flex:1;min-width:0}
.suche span{color:var(--leise)}
.abschn{font:600 10px var(--mono);letter-spacing:.14em;color:var(--leise);text-transform:uppercase;margin:16px 6px 6px;display:flex;justify-content:space-between}
.eintrag{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:5px;cursor:pointer;color:var(--text);white-space:nowrap}
.eintrag:hover{background:var(--fl)}
.eintrag.an{background:var(--akzent);color:#1b0f0b;font-weight:600}
.eintrag.an .zahl{color:#1b0f0b}
.eintrag .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.eintrag .zahl{font:11px var(--mono);color:var(--leise)}
.eintrag .pfeil{width:10px;color:var(--leise);font-size:9px;flex:none}
.eintrag.kind{padding-left:22px;color:var(--gedimmt)}
.eintrag.kind.an{color:#1b0f0b}
.dazu{display:block;width:100%;text-align:left;margin:4px 0 0;padding:5px 8px;border:1px dashed var(--linie2);border-radius:5px;background:none;color:var(--leise);font:11px var(--mono)}
.dazu:hover{color:var(--text);border-color:var(--leise)}
/* Mitte */
.mitte{display:flex;flex-direction:column;min-width:0;min-height:0}
.leiste{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--linie);overflow-x:auto;white-space:nowrap;min-height:42px}
.leiste::-webkit-scrollbar{height:4px}
#typen{flex-wrap:wrap;overflow:visible;white-space:normal;row-gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--linie2);background:var(--fl);border-radius:999px;padding:3px 10px;font:12px var(--mono);color:var(--gedimmt);cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--leise)}
.chip.an{background:var(--akzent);border-color:var(--akzent);color:#1b0f0b;font-weight:600}
.chip i{font-style:normal;opacity:.65}
.chip .punkt{width:7px;height:7px;border-radius:50%}
.bereich{font:12px var(--mono);color:var(--gedimmt);margin-right:6px}
.seg{display:inline-flex}
.seg .k{border-radius:0;padding:3px 10px;font-size:12px}
.seg .k:first-child{border-radius:5px 0 0 5px}
.seg .k:last-child{border-radius:0 5px 5px 0;margin-left:-1px}
.luecke{color:var(--rot);font:700 11px var(--mono);margin-left:6px}
.bereich b{color:var(--text);font-weight:600}
.bereich a{color:var(--akzent);cursor:pointer;margin-left:6px}
.massen{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--wahl);border-bottom:1px solid var(--linie);flex-wrap:wrap}
.massen b{margin-right:6px}
.massen .k{background:#2a1a16;border-color:#5a3328}
.massen .k.rot{color:var(--rot)}
.tafel{flex:1;overflow:auto;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:2;background:var(--bg);text-align:left;font:600 10px var(--mono);letter-spacing:.12em;color:var(--leise);text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--linie);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
th.sortiert{color:var(--akzent)}
td{padding:7px 10px;border-bottom:1px solid var(--linie);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
tr.z{cursor:pointer}
tr.z:hover td{background:var(--fl)}
tr.z.wahl td{background:var(--wahl)}
tr.z.aktiv td{background:var(--wahl2)}
td.cb,th.cb{width:30px;padding-right:0}
td.bild{width:38px;padding:4px 4px 4px 8px}
.typbild{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;font:700 9.5px var(--mono);letter-spacing:.04em}
td.nm{font-weight:500;color:var(--text)}
td.mono{font-family:var(--mono);font-size:12px;color:var(--gedimmt)}
td .lk{color:var(--gedimmt)}
td .lk:hover{color:var(--akzent);text-decoration:underline}
td .leer{color:var(--leise)}
td .fehlt{color:var(--rot);font:11px var(--mono)}
tr.gruppe td{background:var(--panel);font:600 11px var(--mono);letter-spacing:.06em;color:var(--gedimmt);cursor:pointer;padding:6px 10px}
tr.gruppe td b{color:var(--text)}
input[type=checkbox]{accent-color:var(--akzent);width:14px;height:14px;cursor:pointer}
.fuss{border-top:1px solid var(--linie);padding:6px 12px;font:12px var(--mono);color:var(--leise);display:flex;gap:16px}
.leerhinweis{padding:60px 20px;text-align:center;color:var(--leise)}
/* Inspektor */
.ins{border-left:1px solid var(--linie);background:var(--panel);overflow:auto;min-width:0}
.app.ohne-ins .ins{display:none}
.ins .nix{padding:120px 30px;text-align:center;color:var(--leise)}
.ins-kopf{padding:16px 16px 10px;display:flex;gap:12px;align-items:flex-start}
.ins-kopf .typbild{width:44px;height:44px;font-size:12px;border-radius:8px;flex:none}
.ins h2{margin:0;font-size:16px;line-height:1.3;cursor:text;word-break:break-word}
.ins h2:hover{text-decoration:underline dotted var(--leise)}
.ins .typ{font:11px var(--mono);color:var(--leise);margin-top:3px}
.ins .aktionen{display:flex;gap:6px;padding:0 16px 12px;flex-wrap:wrap}
.ins .aktionen .k{font-size:12px;padding:4px 9px}
.karte{margin:0 12px 12px;border:1px solid var(--linie2);border-radius:7px;background:var(--fl);overflow:hidden}
.zeile{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--linie)}
.zeile:last-child{border-bottom:0}
.zeile .l{color:var(--gedimmt);white-space:nowrap}
.zeile .l .stern{color:var(--akzent)}
.zeile .w{font:12px var(--mono);text-align:right;cursor:pointer;min-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile .w:hover{color:var(--akzent)}
.zeile .w.fehlt{color:var(--rot)}
.zeile .w.leer{color:var(--leise)}
.zeile input,.zeile select{background:var(--bg);border:1px solid var(--akzent);border-radius:4px;padding:3px 6px;font:12px var(--mono);max-width:170px;outline:0}
.ins .abschn{margin:14px 16px 6px}
.bez{margin:0 12px 10px}
.bez .titel{font:11px var(--mono);color:var(--gedimmt);margin:0 4px 5px;display:flex;justify-content:space-between}
.bez .titel em{font-style:normal;color:var(--leise)}
.marken{display:flex;flex-wrap:wrap;gap:5px}
.marke2{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linie2);background:var(--fl);border-radius:999px;padding:2px 4px 2px 9px;font-size:12px;max-width:100%}
.marke2 span{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marke2 span:hover{color:var(--akzent)}
.marke2 button{border:0;background:none;color:var(--leise);padding:0 4px;font-size:13px;line-height:1}
.marke2 button:hover{color:var(--rot)}
.marke2.nur{padding-right:9px}
.plus{border:1px dashed var(--linie2);background:none;border-radius:999px;padding:2px 10px;color:var(--leise);font-size:12px}
.plus:hover{color:var(--text);border-color:var(--leise)}
.zuordnen{display:flex;gap:5px;margin-top:6px}
.zuordnen input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--akzent);border-radius:5px;padding:4px 8px;outline:0}
.kette{margin:0 12px 12px;display:flex;flex-direction:column;gap:2px}
.kette .glied{display:flex;gap:8px;font-size:12px;padding:3px 4px}
.kette .glied .l{width:120px;flex:none;color:var(--leise);font:11px var(--mono);padding-top:1px}
.kette .glied .w{color:var(--text)}
.kette .glied .w span{cursor:pointer}
.kette .glied .w span:hover{color:var(--akzent)}
textarea.notiz{width:calc(100% - 24px);margin:0 12px 16px;min-height:70px;background:var(--fl);border:1px solid var(--linie2);border-radius:7px;padding:8px 10px;resize:vertical;outline:0}
textarea.notiz:focus{border-color:var(--akzent)}
/* Menü, Dialog, Meldung */
.menue{position:fixed;z-index:50;background:var(--fl);border:1px solid var(--linie2);border-radius:7px;padding:4px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-height:70vh;overflow:auto}
.menue button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:5px}
.menue button:hover{background:var(--fl2)}
.menue hr{border:0;border-top:1px solid var(--linie);margin:4px 0}
.menue .etikett{padding:6px 10px 2px}
.schleier{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:grid;place-items:center}
.dialog{background:var(--panel);border:1px solid var(--linie2);border-radius:10px;padding:18px;width:min(440px,calc(100vw - 32px));max-height:85vh;overflow:auto}
.dialog h3{margin:0 0 14px;font-size:15px}
.dialog.breit{width:min(1000px,calc(100vw - 32px))}
.dialog textarea{width:100%;min-height:150px;background:var(--fl);border:1px solid var(--linie2);border-radius:6px;padding:8px;font:12px var(--mono);outline:0;resize:vertical}
.dialog textarea:focus{border-color:var(--akzent)}
.imp{width:100%;border-collapse:collapse;margin-top:6px}
.imp td,.imp th{position:static;padding:5px 8px;border-bottom:1px solid var(--linie);max-width:none;cursor:default}
.imp th{background:none}
.imp td.bsp{font:11.5px var(--mono);color:var(--gedimmt);max-width:280px;overflow:hidden;text-overflow:ellipsis}
.imp select{width:100%;background:var(--fl);border:1px solid var(--linie2);border-radius:5px;padding:4px 6px}
.imp select.leer{color:var(--leise)}
.ergebnis{margin-top:14px;padding:10px 12px;border:1px solid var(--linie2);border-radius:7px;background:var(--fl)}
.ergebnis .zahlen{display:flex;gap:16px;font:12px var(--mono);flex-wrap:wrap}
.ergebnis .zahlen b{font-size:15px;color:var(--text)}
.ergebnis .fehlerliste{color:var(--rot);font-size:12px;margin-top:8px;max-height:140px;overflow:auto}
.ergebnis .liste{font:11.5px var(--mono);color:var(--gedimmt);margin-top:8px;max-height:160px;overflow:auto}
.st-neu{color:var(--gruen)} .st-geändert{color:var(--akzent)} .st-gleich{color:var(--leise)}
.dialog label{display:block;font:600 10px var(--mono);letter-spacing:.12em;color:var(--leise);text-transform:uppercase;margin:10px 0 4px}
.dialog input[type=text],.dialog select{width:100%;background:var(--fl);border:1px solid var(--linie2);border-radius:5px;padding:7px 9px;outline:0}
.dialog input[type=text]:focus,.dialog select:focus{border-color:var(--akzent)}
.dialog .hk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--gedimmt)}
.dialog .unten{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dialog .spl{display:flex;align-items:center;gap:8px;padding:4px 2px;border-bottom:1px solid var(--linie)}
.dialog .spl span{flex:1}
.dialog .spl small{color:var(--leise);font:10.5px var(--mono)}
.dialog .spl button{background:none;border:0;color:var(--leise);padding:0 4px}
.dialog .spl button:hover{color:var(--text)}
.meldung{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fl2);border:1px solid var(--linie2);border-radius:8px;padding:9px 14px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:80vw}
.meldung.fehler{border-color:var(--rot)}
.meldung button{background:none;border:0;color:var(--akzent);font-weight:600}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail">
    <div class="kachel" title="Fertigungsatlas">FA</div>
    <div class="platz"></div>
    <button class="knopf" title="Inspektor ein/aus" id="ins-schalter">⇥</button>
  </nav>
  <header class="kopf">
    <div class="marke">FERTIGUNGSATLAS<b>KATALOG</b></div>
    <button class="k-neu" id="neu">＋ Neu ▾</button>
    <span class="etikett">Sortieren</span><select class="sel" id="sortieren"></select>
    <span class="etikett">Gruppieren</span><select class="sel" id="gruppieren"></select>
    <span class="etikett">Layout</span><select class="sel" id="variante"></select>
    <button class="k" id="layoutmenue" title="Spalten und Varianten">⋯</button>
    <div class="rechts" id="stand"></div>
  </header>
  <aside class="seite" id="seite"></aside>
  <main class="mitte">
    <div class="leiste" id="typen"></div>
    <div class="leiste" id="facetten" hidden></div>
    <div class="massen" id="massen" hidden></div>
    <div class="tafel" id="tafel"></div>
    <div class="fuss" id="fuss"></div>
  </main>
  <aside class="ins" id="ins"></aside>
</div>
<script>
"use strict";
// Primär (Anker in der Seitenleiste oder „alle“) → Sekundär (Typ als Zeilen).
// Was zu einem Anker gehört und was in den abgeleiteten Spalten steht, rechnet
// der Server aus dem Modell (kürzeste Wege, flatgraph get_connected); die
// Oberfläche zeigt nur an.
const A = {
  z: null, M: null, N: {}, layouts: {}, anker: null, typ: null, tab: null,
  auswahl: new Set(), aktiv: null, umfeld: null, facetten: {}, suche: "",
  lay: {}, variante: {}, offen: {}, zu: {}, bearb: null, zuordnen: null, baeume: [], importe: {},
  fluss: null,   // bei einem Material als Bereich: „herkunft“ oder „verwendung“
};
// Die Bäume der Seitenleiste: oben → darunter; was darunter gehört, rechnet der
// Server aus dem Modell (Raum ▸ Plant über die Equipments).
const BAEUME = [{titel: "Produkte", oben: "Material", unten: "Material", art: "produkte"},
                {titel: "Ort", oben: "Raum", unten: "Plant"},
                {titel: "Prozesse", oben: "Prozess", unten: "Prozessschritt"}];
const FARBEN = ["#f07c62", "#5aa9e6", "#4fbf8a", "#c792ea", "#e6b85a", "#5ad1c9", "#e66a9a", "#8fa1b3", "#b5d65a", "#d9905a"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const typVon = ref => ref.split("/")[0];
const nameVon = ref => A.N[ref]?.name ?? ref;
const typen = () => A.M ? Object.keys(A.M.typen) : [...new Set(A.z.knoten.map(k => k.typ))];
const farbe = t => FARBEN[Math.max(0, typen().indexOf(t)) % FARBEN.length];
const kuerzel = t => {
  // Zwei Buchstaben je Typ, eindeutig: Prozess „PR“, Prozessschritt „PS“ (Buchstabe nach dem gemeinsamen Anfang)
  if (!A.kuerzel) {
    A.kuerzel = {}; const vergeben = new Set();
    for (const x of typen()) {
      let k = x.slice(0, 2).toUpperCase();
      if (vergeben.has(k)) {
        const p = Math.max(...Object.keys(A.kuerzel).map(u => { let i = 0; while (u[i] && u[i] === x[i]) i++; return i; }));
        k = (x[0] + (x[p] || x[x.length - 1])).toUpperCase();
      }
      vergeben.add(k); A.kuerzel[x] = k;
    }
  }
  return A.kuerzel[t] || t.slice(0, 2).toUpperCase();
};
const typbild = t => `<div class="typbild" style="background:${farbe(t)}22;color:${farbe(t)}">${esc(kuerzel(t))}</div>`;
const felderVon = t => A.M?.typen[t]?.felder || [];
const namefeld = t => A.M?.typen[t]?.namefeld;
const feldTitel = (t, f) => (felderVon(t).find(x => x.name === f)?.titel) || f;
const vergleich = (a, b) => String(a).localeCompare(String(b), "de", {numeric: true, sensitivity: "base"});
const ls = {lies(k, d) { try { return JSON.parse(localStorage.getItem("atlas." + k)) ?? d; } catch { return d; } },
            schreib(k, v) { try { localStorage.setItem("atlas." + k, JSON.stringify(v)); } catch {} }};

async function api(name, daten) {
  const r = await fetch("/api/" + name, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(daten || {})});
  const d = await r.json();
  if (!r.ok) throw new Error(d.fehler || "Fehler");
  if (d.zustand) setzeZustand(d.zustand);
  return d;
}
function setzeZustand(z) {
  A.z = z; A.M = z.modell; A.N = {};
  for (const k of z.knoten) A.N[k.ref] = k;
}
function meldung(text, fehler, rueck) {
  document.querySelectorAll(".meldung").forEach(e => e.remove());
  const d = document.createElement("div");
  d.className = "meldung" + (fehler ? " fehler" : "");
  d.innerHTML = `<span>${esc(text)}</span>` + (rueck ? `<button>Rückgängig</button>` : "");
  if (rueck) d.querySelector("button").onclick = () => { d.remove(); rueck(); };
  document.body.appendChild(d);
  setTimeout(() => d.remove(), rueck ? 8000 : 4500);
}
async function tu(name, daten, text) {
  try { const d = await api(name, daten); if (text || d.hinweis) meldung(d.hinweis || text); await neuLaden(); return d; }
  catch (e) { meldung(e.message, true); return null; }
}

// --- Laden ---------------------------------------------------------------
async function start() {
  const r = await (await fetch("/api/zustand")).json();
  setzeZustand(r.zustand); A.layouts = r.layouts || {}; A.importe = r.importe || {};
  A.variante = ls.lies("variante", {});
  const h = new URLSearchParams(location.hash.slice(1));
  A.anker = h.get("anker") && A.N[h.get("anker")] ? h.get("anker") : null;
  A.typ = h.get("typ") && typen().includes(h.get("typ")) ? h.get("typ") : (typen().includes("Equipment") ? "Equipment" : typen()[0]);
  A.aktiv = h.get("objekt") && A.N[h.get("objekt")] ? h.get("objekt") : null;
  A.fluss = ["herkunft", "verwendung"].includes(h.get("fluss")) ? h.get("fluss") : null;

// --- Layout (Spalten, Sortierung, Gruppe je Typ) ---------------------------
function spaltenAlle() {
  // Eigene Felder des Modells, dann die abgeleiteten Spalten des Servers

  const frei = new Set();
  for (const r of A.tab?.zeilen || []) for (const k in (A.N[r]?.felder || {})) if (!eigene.some(e => e.key === "f:" + k)) frei.add(k);
  return [...eigene, ...[...frei].sort().map(k => ({key: "f:" + k, titel: k, feld: {name: k}})),

          sort: "name", absteigend: false, gruppe: ""};

// --- Seitenleiste --------------------------------------------------------
function reihenfolge(refs) {
  // Prozessschritte entlang „Nachfolger“ (Selbstbeziehung des Typs) ordnen, sonst nach Name
  const menge = new Set(refs), ein = {}, nach = {};
  for (const k of A.z.kanten) {
    if (!menge.has(k.von) || !menge.has(k.nach) || typVon(k.von) !== typVon(k.nach) || k.von === k.nach) continue;
    // Eine Schleife (Kanten-Attribut laut Modell) führt zurück und bestimmt die Reihenfolge nicht
    if (Object.values(k.felder || {}).some(v => /loop|schleife/i.test(v))) continue;
    (nach[k.von] ||= []).push(k.nach); ein[k.nach] = (ein[k.nach] || 0) + 1;
  }
  const fertig = [], rest = [...refs].sort((a, b) => vergleich(nameVon(a), nameVon(b)));
  const warte = rest.filter(r => !ein[r]), gesehen = new Set();
  while (warte.length || fertig.length < rest.length) {
    const r = warte.length ? warte.shift() : rest.find(x => !gesehen.has(x));
    if (gesehen.has(r)) continue;
    gesehen.add(r); fertig.push(r);
    for (const n of (nach[r] || []).sort((a, b) => vergleich(nameVon(a), nameVon(b)))) if (!gesehen.has(n) && --ein[n] <= 0) warte.push(n);
  }
  return fertig;
}
function eintrag(ref, text, zahl, klasse, pfeil) {

    (pfeil !== undefined ? `<span class="pfeil" data-auf="${esc(ref)}">${pfeil}</span>` : "") +
    `<span class="nm">${esc(text)}</span>${zahl !== "" ? `<span class="zahl">${zahl}</span>` : ""}</div>`;
}
function seite() {

  if (s) {

    h += `<div class="abschn"><span>Im Bestand</span><span>${treffer.length}</span></div>`;
    h += treffer.map(k => `<div class="eintrag" data-oeffne="${esc(k.ref)}" title="${esc(k.typ)}"><span class="nm">${esc(k.name)}</span><span class="zahl">${esc(kuerzel(k.typ))}</span></div>`).join("")

    h += `<div class="abschn"><span>${esc(b.titel)}</span><span>${oben.length}</span></div>`;

// --- Typen und Facetten über der Tabelle ---------------------------------

// --- Import: Tabelle aus Sheets/Excel einfügen -------------------------------
function importZiele(typ) {
  // Was eine Spalte sein kann: Name, Felder des Modells, eine direkte Beziehung.
  // Beziehungen mit Pflichtattribut (Typ eines Schrittübergangs) gibt es hier nicht.
  const nf = namefeld(typ);
  return [{w: "", t: "— übergehen —"}, {w: "name", t: "Name"},
    ...felderVon(typ).filter(f => f.name !== nf).map(f => ({w: "feld:" + f.name, t: (f.titel || f.name) + (f.name === A.M?.typen[typ]?.idfeld ? " (Schlüssel)" : "")})),
    ...typen().flatMap(z => regelnZwischen(typ, z).filter(m => !(A.M?.kantenfelder?.[m.art] || []).some(f => f.pflicht))
      .map(m => ({w: `bez:${m.art}|${m.richtung}|${z}`, t: `→ ${z} (${m.richtung === "aus" ? "" : "← "}${m.art})`})))];
}
function importVorschlag(typ, kopf) {
  // Gemerkte Zuordnung zuerst, sonst nach Spaltenname: Feld, Titel, Typname
  const ziele = importZiele(typ), gemerkt = A.importe[typ] || {}, n = s => String(s).trim().toLowerCase();
  const idf = A.M?.typen[typ]?.idfeld;
  return kopf.map(k => {
    if (gemerkt[k] !== undefined && ziele.some(z => z.w === gemerkt[k])) return gemerkt[k];
    const x = n(k);
    if (["name", "bezeichnung", n(namefeld(typ) || "")].includes(x)) return "name";
    // In SAP-Exporten heisst die Nummerspalte wie der Typ („Equipment“)
    if (idf && ["id", n(idf), n(typ), n(typ) + "-nr", n(typ) + "nummer"].includes(x)) return "feld:" + idf;
    const f = felderVon(typ).find(f => n(f.name) === x || n(f.titel || "") === x);
    if (f && f.name !== namefeld(typ)) return "feld:" + f.name;
    const bez = ziele.filter(z => z.w.startsWith("bez:") && n(z.w.split("|")[2]) === x);
    return bez.length === 1 ? bez[0].w : "";
  });
}

    };
    s.querySelector("#mz-z").focus();
  };
}

// --- Inspektor -----------------------------------------------------------
function eingabe(f, v, id, mitLeer) {
  if (f?.optionen && !f.freitext)
    return `<select id="${id}">${mitLeer ? `<option value="">(leer)</option>` : `<option value=""></option>`}${f.optionen.map(o => `<option${o === v ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  const dl = f?.optionen ? `<datalist id="${id}-l">${f.optionen.map(o => `<option value="${esc(o)}">`).join("")}</datalist>` : "";
  return `<input type="text" id="${id}" value="${esc(v)}"${dl ? ` list="${id}-l"` : ""} autocomplete="off">${dl}`;
}
function inspektor() {
  const el = $("#ins"), r = A.aktiv, k = A.N[r];
  if (!k) { el.innerHTML = `<div class="nix">Wähle ein Objekt aus, um Details, Zusammenhang und Beziehungen zu sehen.</div>`; return; }
  const t = k.typ, nf = namefeld(t), fl = felderVon(t).filter(f => f.name !== nf);
  const frei = Object.keys(k.felder).filter(x => !fl.some(f => f.name === x));
  let h = `<div class="ins-kopf">${typbild(t)}<div style="min-width:0"><h2 id="i-name" title="Klicken zum Umbenennen">${esc(k.name)}</h2><div class="typ">${esc(t)}</div></div></div>`;
  h += `<div class="aktionen"><button class="k" id="i-bereich">Als Bereich →</button><button class="k" id="i-weg">Löschen</button></div>`;
  // Kontext: die Kette (Raum, Plant, Prozess, Schritt), soweit abgeleitet
  const sp = A.umfeld?.spalten || [], we = A.umfeld?.werte || {};
  if (k.luecken?.length) h += `<div class="karte" style="border-color:var(--rot);padding:8px 12px;color:var(--rot);font-size:12px">${k.luecken.map(esc).join("<br>")}</div>`;
  const kette = sp.filter(s => (s.pfad.length > 1 || !s.pfad.length) && s.standard && we[s.key]?.length);
  if (kette.length) h += `<div class="abschn"><span>Zusammenhang</span></div><div class="kette">` + kette.map(s =>
    `<div class="glied"><span class="l" title="${esc(s.weg)}">${esc(s.titel)}</span><span class="w">${s.text ? esc(we[s.key].join(", ")) : we[s.key].map(x => `<span data-oeffne="${esc(x)}">${esc(nameVon(x))}</span>`).join(", ")}</span></div>`).join("") + `</div>`;
  // Eigenschaften
  h += `<div class="abschn"><span>Eigenschaften</span></div><div class="karte">` +
    [...fl, ...frei.map(x => ({name: x, titel: x}))].map(f => {
      const v = k.felder[f.name] ?? "", wird = A.bearb === f.name;
      const w = wird ? eingabe(f, v, "i-feld") : `<span class="w${v === "" ? (k.fehlt.includes(f.name) ? " fehlt" : " leer") : ""}" data-feld="${esc(f.name)}" title="${esc(v)}">${v === "" ? (k.fehlt.includes(f.name) ? "fehlt" : "–") : esc(v)}</span>`;
      return `<div class="zeile"><span class="l">${esc(f.titel || f.name)}${f.pflicht ? ' <span class="stern">*</span>' : ""}</span>${w}</div>`;
    }).join("") + `<div class="zeile"><span class="l" style="color:var(--leise)">eigenes Feld</span><span class="w leer" id="i-eigen">＋</span></div></div>`;
  // Beziehungen: jede direkte Beziehung des Modells, auch leere — dort wird zugeordnet
  h += `<div class="abschn"><span>Beziehungen</span></div>`;
  for (const s of sp.filter(s => s.pfad.length === 1)) {
    const st = s.pfad[0], ziele = (we[s.key] || []).slice().sort((a, b) => vergleich(nameVon(a), nameVon(b)));
    h += `<div class="bez"><div class="titel"><span>${esc(st.typ)}</span><em>${st.richtung === "aus" ? "→ " : "← "}${esc(st.art)}</em></div><div class="marken">` +
      ziele.map(z => `<span class="marke2"><span data-oeffne="${esc(z)}">${esc(nameVon(z))}</span><button data-loesen="${esc(s.key)}|${esc(z)}" title="Beziehung entfernen">×</button></span>`).join("") +
      `<button class="plus" data-zuordnen="${esc(s.key)}">＋ ${esc(st.typ)}</button></div>` +
      (A.zuordnen === s.key ? `<div class="zuordnen"><input id="i-zu" list="i-zu-l" placeholder="${esc(st.typ)} suchen oder neu …" autocomplete="off"><datalist id="i-zu-l">${
        A.z.knoten.filter(x => x.typ === st.typ && x.ref !== r && !ziele.includes(x.ref)).sort((a, b) => vergleich(a.name, b.name)).map(x => `<option value="${esc(x.name)}">`).join("")}</datalist>` +
        `<button class="k" id="i-zu-ok">OK</button></div>` + kantenFelderHtml(st.art).replace('id="n-kf"', 'id="i-kf"') : "") + `</div>`;
  }
  const weitere = sp.filter(s => s.pfad.length > 1 && !s.standard && we[s.key]?.length);
  if (weitere.length) h += `<div class="abschn"><span>Weiter entfernt</span></div><div class="kette">` + weitere.map(s =>
    `<div class="glied"><span class="l" title="${esc(s.weg)}">${esc(s.titel)}</span><span class="w">${we[s.key].map(x => `<span data-oeffne="${esc(x)}">${esc(nameVon(x))}</span>`).join(", ")}</span></div>`).join("") + `</div>`;
  h += `<div class="abschn"><span>Notiz</span></div><textarea class="notiz" id="i-notiz" placeholder="Notiz …">${esc(k.notiz)}</textarea>`;
  el.innerHTML = h;

  el.querySelectorAll("[data-oeffne]").forEach(x => x.onclick = () => oeffne(x.dataset.oeffne));
  $("#i-bereich").onclick = () => setzeAnker(r);
  $("#i-weg").onclick = async () => {
    if (!confirm(`„${k.name}“ löschen? (lässt sich rückgängig machen)`)) return;
    if (await tu("loeschen", {ref: r})) meldung(`„${k.name}“ gelöscht`, false, async () => { await tu("zurueck", {ref: r}); oeffne(r); });
  };
  $("#i-name").onclick = () => {
    const h2 = $("#i-name"); h2.innerHTML = `<input type="text" value="${esc(k.name)}" style="width:100%;background:var(--bg);border:1px solid var(--akzent);border-radius:4px;padding:3px 6px;font:600 15px var(--sans);outline:0">`;
    const i = h2.querySelector("input"); i.focus(); i.select(); h2.onclick = null;
    const fertig = async ok => { if (ok && i.value.trim() && i.value.trim() !== k.name) await tu("aendern", {ref: r, name: i.value.trim()}); else inspektor(); };
    i.onkeydown = e => { if (e.key === "Enter") fertig(true); if (e.key === "Escape") fertig(false); };
    i.onblur = () => fertig(true);
  };
  el.querySelectorAll("[data-feld]").forEach(x => x.onclick = () => { A.bearb = x.dataset.feld; inspektor(); });
  const fe = $("#i-feld");
  if (fe) {
    fe.focus(); if (fe.select) fe.select();
    let erledigt = false;
    const speichern = async ok => {
      if (erledigt) return; erledigt = true;
      const f = A.bearb; A.bearb = null;
      if (ok && fe.value !== (k.felder[f] ?? "")) await tu("aendern", {ref: r, felder: {[f]: fe.value}}); else inspektor();
    };
    fe.onkeydown = e => { if (e.key === "Enter") speichern(true); if (e.key === "Escape") speichern(false); };
    fe.onblur = () => speichern(true);
    if (fe.tagName === "SELECT") fe.onchange = () => speichern(true);
  }
  $("#i-eigen").onclick = async () => {
    const name = prompt("Name des eigenen Feldes:"); if (!name?.trim()) return;
    A.bearb = name.trim(); k.felder[A.bearb] ??= ""; inspektor();
  };
  el.querySelectorAll("[data-zuordnen]").forEach(b => b.onclick = () => { A.zuordnen = A.zuordnen === b.dataset.zuordnen ? null : b.dataset.zuordnen; inspektor(); $("#i-zu")?.focus(); });
  el.querySelectorAll("[data-loesen]").forEach(b => b.onclick = async () => {
    const [key, z] = b.dataset.loesen.split("|"), st = sp.find(s => s.key === key).pfad[0];
    const [von, nach] = st.richtung === "aus" ? [r, z] : [z, r];
    const kante = A.z.kanten.find(e => e.von === von && e.nach === nach && e.art === st.art);
    if (kante && await tu("kante_weg", {id: kante.id})) {
      A.umfeld = await api("umfeld", {ref: r}); inspektor();
      meldung("Beziehung entfernt", false, () => tu("kante", {ref: von, ziel: nach, art: st.art, richtung: "aus", felder: kante.felder}));
    }
  });
  const zu = $("#i-zu");
  if (zu) {
    const ok = async () => {
      const st = sp.find(s => s.key === A.zuordnen).pfad[0], name = zu.value.trim(); if (!name) return;
      const felder = kantenFelderWerte(el), vorh = A.z.knoten.find(x => x.typ === st.typ && x.name.toLowerCase() === name.toLowerCase());
      // Neu angelegt wird nur, was es im Typ noch nicht gibt — der Server prüft das ebenfalls
      const d = vorh ? await tu("kante", {ref: r, ziel: vorh.ref, art: st.art, richtung: st.richtung, felder})
                     : await tu("anlegen", {typ: st.typ, name, verknuepfen: [{ziel: r, art: st.art, richtung: st.richtung === "aus" ? "ein" : "aus", felder}]},
                                `${st.typ} „${name}“ angelegt`);
      if (d) { A.zuordnen = null; A.umfeld = await api("umfeld", {ref: r}); inspektor(); }
    };
    $("#i-zu-ok").onclick = ok;
    zu.onkeydown = e => { if (e.key === "Enter") ok(); if (e.key === "Escape") { A.zuordnen = null; inspektor(); } };
  }
  const no = $("#i-notiz");
  no.onblur = () => { if (no.value !== k.notiz) tu("aendern", {ref: r, notiz: no.value}); };
}

// --- Tasten ----------------------------------------------------------------
addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#suchfeld")?.focus(); return; }
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName) || document.querySelector(".schleier")) return;
  if (e.key === "Escape") { if (A.auswahl.size) { A.auswahl.clear(); tafel(); massenLeiste(); } else { A.aktiv = null; merkeHash(); tafel(); inspektor(); } }
  if (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "j" || e.key === "k") {
    const z = sichtbareZeilen(); if (!z.length) return;
    const i = z.indexOf(A.aktiv), n = e.key === "ArrowDown" || e.key === "j" ? Math.min(z.length - 1, i + 1) : Math.max(0, i - 1);
    e.preventDefault(); oeffne(z[i < 0 ? 0 : n]).then(() => document.querySelector("tr.aktiv")?.scrollIntoView({block: "nearest"}));
  }
});
start();
</script>
</body>
