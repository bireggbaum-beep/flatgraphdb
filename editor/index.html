<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Graph-Editor</title>
<style>
:root{
  --bg:#0d0f13;--pan:#13161c;--raised:#1a1e26;--hover:#1f242d;--lin:#252a34;--lin2:#303644;
  --tx:#e4e7ee;--mut:#8b92a5;--dim:#5d6477;
  --akz:#7c93ff;--akzb:#232b4d;--ok:#4fd1a1;--warn:#ff7a6b;
  --sh:0 12px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;text-align:left}
input,select,textarea{background:var(--raised);border:1px solid var(--lin);border-radius:6px;padding:5px 9px;outline:none;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:var(--akz);box-shadow:0 0 0 3px rgba(124,147,255,.15)}
::placeholder{color:var(--dim)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--lin2);border-radius:6px;border:2px solid var(--pan)}::-webkit-scrollbar-track{background:transparent}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--lin2);border-radius:4px;padding:0 5px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.mut{color:var(--mut)}.dim{color:var(--dim)}

#kopf{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--lin);background:var(--pan)}
.marke{font-weight:700;letter-spacing:.02em;display:flex;gap:8px;align-items:center}
.marke i{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--akz),#b57cff)}
.suchknopf{flex:1;max-width:440px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--lin);border-radius:8px;padding:6px 10px;color:var(--dim)}
.suchknopf:hover{border-color:var(--lin2)}.suchknopf kbd{margin-left:auto}
.btn{background:var(--akz);color:#0b0e18;font-weight:600;border-radius:7px;padding:6px 13px;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn.zweit{background:var(--raised);color:var(--tx);font-weight:500;border:1px solid var(--lin)}.btn.zweit:hover{border-color:var(--lin2)}
.btn.klein{padding:2px 9px;font-size:12px}
.ghost{color:var(--mut);padding:3px 8px;border-radius:6px;white-space:nowrap}.ghost:hover{background:var(--hover);color:var(--tx)}
.ghost .badge{margin-left:4px}

/* Arbeitsfeld */
#app{flex:1;min-height:0;display:flex}
#spalten{flex:1;min-width:0;display:flex;overflow-x:auto;overflow-y:hidden;gap:0}
#insp{flex:none;width:380px;background:var(--pan);border-left:1px solid var(--lin);overflow:auto}
#insp:empty{display:none}
.pane{flex:0 0 auto;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--lin);background:var(--bg)}
.pane.fokus .phead{box-shadow:inset 0 2px 0 var(--akz)}
.phead{background:var(--pan);border-bottom:1px solid var(--lin);padding:8px 12px 8px}
.p1{display:flex;align-items:center;gap:8px}
.ptitel{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.ptitel b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn{background:var(--raised);border-radius:10px;padding:0 8px;color:var(--mut);font-size:12px}
.psub{color:var(--dim);font-size:12px;margin:1px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.p2 .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--lin);border-radius:7px;overflow:hidden}
.seg button{padding:2px 9px;font-size:12px;color:var(--mut)}.seg .on{background:var(--akz);color:#0b0e18;font-weight:600}
.badge{background:var(--akz);color:#0b0e18;border-radius:9px;padding:0 6px;font-size:11px;font-weight:600}
.pchips{display:flex;gap:5px;flex-wrap:wrap;padding:7px 12px 0}
.fchip{display:inline-flex;align-items:center;gap:5px;background:var(--akzb);border:1px solid #33407a;border-radius:13px;padding:0 3px 0 9px;font-size:12px}
.fchip.neg{background:#3a2023;border-color:#6b3037}
.fchip button{color:var(--mut);padding:0 6px;border-radius:10px}.fchip button:hover{color:var(--tx);background:rgba(255,255,255,.1)}
.pbody{flex:1;min-height:0;display:flex}
.pane.klein{width:44px!important;cursor:pointer;background:var(--pan)}.pane.klein:hover{background:var(--hover)}.pane.klein .vt{writing-mode:vertical-rl;padding:14px 0;display:flex;gap:10px;align-items:center;color:var(--mut);white-space:nowrap}.pane.klein .vt b{color:var(--tx);font-weight:600}
.pfac{flex:none;width:270px;overflow:auto;background:var(--pan);border-right:1px solid var(--lin)}
.pres{flex:1;min-width:0;overflow:auto;padding:0 10px 24px}
.neuzeile{display:flex;gap:6px;align-items:center;padding:8px 0 2px}.neuzeile input{flex:1;min-width:0}
.neuhinweis{color:var(--mut);font-size:12px;padding:0 0 8px}

/* Facetten */
.fkopf{padding:10px 10px 8px;position:sticky;top:0;background:var(--pan);z-index:2;border-bottom:1px solid var(--lin);display:flex;flex-direction:column;gap:6px}
.fkopf input{width:100%}
.fg{border-bottom:1px solid var(--lin)}
.fh{width:100%;display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:600}
.fh:hover{color:var(--tx)}.fh .car{width:10px;color:var(--dim)}.fh .badge{margin-left:auto}
.fb2{padding:0 4px 8px}
.fz{position:relative;display:flex;align-items:center;gap:7px;padding:2px 7px;border-radius:6px;cursor:pointer;overflow:hidden;min-height:25px}
.fz:hover{background:var(--hover)}
.fz .fl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.fz .fn{color:var(--mut);font-size:12px;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.fz .fbar{position:absolute;left:0;top:2px;bottom:2px;background:rgba(124,147,255,.10);border-radius:5px;z-index:0}
.fz .cb{width:13px;height:13px;border:1px solid var(--lin2);border-radius:4px;flex:none;position:relative;z-index:1;display:grid;place-items:center;font-size:10px;line-height:1}
.fz.on .cb{background:var(--akz);border-color:var(--akz);color:#0b0e18}.fz.on .cb::after{content:"✓"}
.fz.on .fl{color:#fff}.fz.null:not(.on){opacity:.4}
.pill-zeile{display:flex;align-items:center;gap:5px;padding:3px 6px}
.pill-zeile .fl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:1px solid var(--lin);border-radius:12px;padding:0 7px;font-size:12px;color:var(--mut);white-space:nowrap}
.pill:hover{border-color:var(--lin2);color:var(--tx)}.pill.on{background:var(--akz);border-color:var(--akz);color:#0b0e18;font-weight:600}
.pill.on.neg{background:var(--warn);border-color:var(--warn)}.pill.null{opacity:.35}
.mehr{padding:2px 9px;color:var(--akz);font-size:12px}
.fhint{padding:2px 10px 8px;color:var(--dim);font-size:12px}
.zblock{border:1px solid var(--lin);border-radius:8px;margin:4px 4px 8px;padding:4px 2px 6px;background:rgba(255,255,255,.015)}
.zkopf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 8px 6px}.zkopf select{padding:2px 6px;font-size:12px}.zkopf .chk{font-size:12px;color:var(--mut);display:flex;gap:4px;align-items:center}
.fsub{padding:8px 8px 2px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-top:1px dashed var(--lin);margin-top:6px}

/* Ergebnisse */
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;background:var(--bg);z-index:1;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--lin);cursor:pointer;white-space:nowrap}
th:hover{color:var(--tx)}
td{padding:5px 8px;border-bottom:1px solid var(--lin);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.gr td{background:var(--pan);color:var(--mut);font-weight:600;cursor:pointer;max-width:none}tr.gr:hover td{color:var(--tx)}
tr.z{cursor:pointer}tr.z:hover td{background:var(--pan)}tr.z.on td{background:var(--akzb)}
td.nm{font-weight:500}td.nm .dot{margin-right:7px}
.luecke{color:var(--warn);font-weight:700}
.li{display:flex;align-items:center;gap:9px;padding:7px 8px;border-bottom:1px solid var(--lin);cursor:pointer}
.li:hover{background:var(--pan)}.li.on{background:var(--akzb)}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gk{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;padding:12px 8px 4px}
.leer{color:var(--mut);padding:34px 14px;text-align:center}
.ueber{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;padding:6px 0}
.herk{color:var(--mut)}
.zb{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.zb:hover{background:var(--hover)}.zb.ueber2{border-color:var(--akz);background:var(--akzb)}.zb.on{background:var(--akzb)}
.kinder{margin-left:16px;border-left:1px dashed var(--lin2);padding-left:3px}
.caret{width:14px;text-align:center;color:var(--dim)}
.wurzel{margin-top:10px;padding:8px;border:1px dashed var(--lin2);border-radius:8px;color:var(--dim);text-align:center;font-size:12px}
.wurzel.ueber2{border-color:var(--akz);color:var(--akz)}
.baumtool{display:flex;gap:6px;padding:8px 0;flex-wrap:wrap}
.bar{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:6px;cursor:pointer}.bar:hover{background:var(--hover)}
.bar .bl{width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .bt{flex:1;height:14px;background:var(--raised);border-radius:4px;overflow:hidden}.bar .bt i{display:block;height:100%;border-radius:4px}.bar .bn{width:34px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.fluss text{fill:var(--tx);text-anchor:middle}.fluss g[data-act]{cursor:pointer}.fluss g[data-act]:hover rect{stroke:var(--akz)}
.gsvg{width:100%;height:calc(100% - 30px);min-height:380px;background:var(--pan);border:1px solid var(--lin);border-radius:10px;cursor:grab;margin-top:8px}
.gsvg text{fill:var(--tx);font-size:10px;text-anchor:middle;pointer-events:none}
.gsvg .k{stroke:var(--lin2);stroke-width:1}.gsvg .k.m{stroke:var(--akz);stroke-width:1.6}
.gsvg g[data-act]{cursor:pointer}.gsvg g[data-act]:hover circle{stroke:#fff;stroke-width:2}

/* Fragen */
.fragen{display:flex;flex-direction:column;gap:10px;padding:12px}
.frage{background:var(--pan);border:1px solid var(--lin);border-radius:10px;padding:11px 13px}
.frage h4{margin:0 0 3px;font-size:13px}.frage p{margin:0 0 8px;color:var(--mut);font-size:12px}.frage input{width:100%}

/* Inspektor */
.ikopf{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--lin);position:sticky;top:0;background:var(--pan);z-index:2}
.ikopf .sp{flex:1}
.ibody{padding:14px 16px 40px}
#titel{font-size:20px;font-weight:700;border-radius:6px;padding:2px 6px;margin:0 -6px;outline:none}
#titel:hover{background:var(--hover)}#titel:focus{background:var(--raised);box-shadow:0 0 0 1px var(--akz)}
.tchip{display:inline-flex;align-items:center;gap:6px;color:var(--mut);margin-top:2px}
h3.sekt{cursor:pointer;display:flex;align-items:center;gap:6px}h3.sekt .car{width:10px;color:var(--dim)}h3.sekt:hover{color:var(--tx)}h3.sekt .tief{margin-left:auto;float:none;margin-top:0}
.wo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 0}.wo .dim{font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-right:2px}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:600;margin:22px 0 8px}
.felder{display:grid;grid-template-columns:130px 1fr;gap:5px 10px;align-items:center}
.felder label{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis}.pf{color:var(--warn)}
.felder input,.felder select{width:100%;border-color:transparent;background:var(--raised)}
.felder input:focus,.felder select:focus{border-color:var(--akz)}.felder .lk{border-color:#6b3037}
.notiz{min-height:64px;padding:8px 10px;border-radius:8px;background:var(--raised);white-space:pre-wrap;cursor:text;line-height:1.55;border:1px solid transparent}
.notiz:empty::before{content:attr(data-ph);color:var(--dim)}
textarea.notiz{width:100%;resize:vertical;display:block;border-color:var(--akz)}
.ref{color:var(--akz);background:var(--akzb);border-radius:4px;padding:0 4px;cursor:pointer}.ref.tot{color:var(--warn);background:none;text-decoration:underline dotted;cursor:default}
.gruppe{margin:0 0 10px}.gl{font-size:12px;color:var(--mut);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--raised);border:1px solid var(--lin);border-radius:7px;padding:2px 4px 2px 8px;cursor:pointer}
.chip:hover{border-color:var(--akz)}.chip small{color:var(--dim)}
.x{color:var(--dim);padding:0 5px;border-radius:4px}.x:hover{background:var(--lin2);color:var(--warn)}
.attr{margin:4px 0 0 2px;font-size:12px;color:var(--mut)}.attr select{padding:1px 6px;font-size:12px}
.addrel{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.addrel input{flex:1;min-width:120px}
.karte{background:var(--bg);border:1px solid var(--lin);border-radius:10px;padding:6px}
.karte svg text{fill:var(--tx);font-size:10px;text-anchor:middle;pointer-events:none}
.karte svg .k{stroke:var(--lin2);stroke-width:1.2}.karte svg .k.m{stroke:var(--akz);stroke-width:1.5}
.karte svg g[data-act]{cursor:pointer}.karte svg g[data-act]:hover circle{stroke:#fff;stroke-width:2}
.tief{display:inline-flex;border:1px solid var(--lin);border-radius:6px;overflow:hidden;float:right;margin-top:-3px}
.tief button{padding:0 9px;font-size:12px}.tief .on{background:var(--akzb)}
.liste .r{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}.liste .r:hover{background:var(--hover)}
.gefahr{color:var(--warn);font-size:12px;margin-top:26px}

/* Dialog, Vorschläge, Hinweis */
#schleier{position:fixed;inset:0;background:rgba(3,5,10,.6);display:none;align-items:flex-start;justify-content:center;padding-top:10vh;z-index:20}
#box{background:var(--pan);border:1px solid var(--lin2);border-radius:14px;box-shadow:var(--sh);width:min(640px,94vw);max-height:80vh;overflow:auto;padding:10px}
#box>input.gross{width:100%;font-size:15px;border:none;border-bottom:1px solid var(--lin);border-radius:0;padding:9px 6px;background:none;box-shadow:none}
.pz{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:7px;cursor:pointer}
.pz.on,.pz:hover{background:var(--akzb)}.pz small{color:var(--mut);margin-left:auto}
#sug{position:fixed;background:var(--pan);border:1px solid var(--lin2);border-radius:10px;box-shadow:var(--sh);z-index:30;display:none;min-width:240px;padding:4px}
#pop{position:fixed;background:var(--pan);border:1px solid var(--lin2);border-radius:10px;box-shadow:var(--sh);z-index:25;display:none;padding:8px;min-width:230px;max-height:60vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2a3040;border:1px solid var(--lin2);padding:8px 14px;border-radius:9px;display:none;z-index:40;max-width:80vw;box-shadow:var(--sh)}
#toast.fehler{background:#4a1f25;border-color:#7a3038}#toast button{margin-left:12px;color:var(--akz);text-decoration:underline}
.dlg label.l{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:14px 0 5px}
.dlg textarea{width:100%;min-height:170px;font-family:ui-monospace,monospace;font-size:12px}
.zeile{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cc{border:1px solid var(--lin);border-radius:12px;padding:1px 10px;color:var(--mut)}.cc:hover{border-color:var(--lin2);color:var(--tx)}.cc.on{background:var(--akzb);border-color:#33407a;color:var(--tx)}
.weg{padding:4px 0;color:var(--mut)}.weg b{color:var(--tx);font-weight:600}
.vorschau{margin-top:14px;padding:10px 12px;background:var(--raised);border-radius:8px;color:var(--mut)}.vorschau b{color:var(--tx);font-size:16px}
</style>
</head>
<body>
<header id="kopf"></header>
<div id="app"><div id="spalten"></div><aside id="insp"></aside></div>
<div id="schleier"><div id="box"></div></div>
<div id="sug"></div><div id="pop"></div><div id="toast"></div>

<script>
/* ================= Zustand ================= */
let S = {knoten: [], kanten: [], modell: null};
let M = new Map(), NB = new Map();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v } catch (e) { return d } },
  set: (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} }
};
const enc = encodeURIComponent;
const tgl = (arr, v) => { const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v); };
function indexieren() {
  M = new Map(S.knoten.map(k => [k.ref, k])); NB = new Map();
  const add = (r, x) => { if (!NB.has(r)) NB.set(r, []); NB.get(r).push(x); };
  for (const e of S.kanten) {
    if (e.gerichtet) { add(e.von, {dir: 'aus', art: e.art, andere: e.nach, e}); add(e.nach, {dir: 'ein', art: e.art, andere: e.von, e}); }
    else { add(e.von, {dir: 'un', art: e.art, andere: e.nach, e}); add(e.nach, {dir: 'un', art: e.art, andere: e.von, e}); }
  }
}
const typenListe = () => S.modell ? Object.keys(S.modell.typen) : [...new Set(S.knoten.map(k => k.typ))].sort();
const artenListe = () => S.modell ? S.modell.arten : [...new Set(S.kanten.map(k => k.art))].sort();
const farbe = typ => `hsl(${(Math.max(0, typenListe().indexOf(typ)) * 41 + 220) % 360} 68% 64%)`;
const punkt = typ => `<i class="dot" style="background:${farbe(typ)}"></i>`;
const nameVon = ref => (M.get(ref) || {name: ref}).name;
const kf = art => (S.modell && S.modell.kantenfelder[art]) || [];
const artRichtung = a => ['ist teil von', 'gehört zu', 'steht in'].includes(a.toLowerCase());
const nbrs = ref => NB.get(ref) || [];
const hatBez = ref => nbrs(ref).length > 0;
const hatTyp = (ref, t) => nbrs(ref).some(n => (M.get(n.andere) || {}).typ === t);
const modellTyp = typ => S.modell && S.modell.typen[typ];
// Modell-Feldnamen tragen den Typ als Vorsilbe (EquipmentGXP, ParameterTargetValue): ohne sie und mit Leerzeichen lesen
const fl = name => {
  const pre = S.modell ? Object.values(S.modell.typen).map(t => t.namefeld.replace(/Name$/, '')).filter(Boolean).sort((a, b) => b.length - a.length) : [];
  let n = name; for (const pf of pre) if (n.startsWith(pf) && n.length > pf.length && /[A-Z]/.test(n[pf.length])) { n = n.slice(pf.length); break; }
  return n.replace(/([a-z])([A-Z])/g, '$1 $2');
};

/* ================= Server ================= */
let tt;
function toast(text, fehler, rueck) {
  const t = $('toast'); t.className = fehler ? 'fehler' : ''; t.textContent = text;
  if (rueck) { const b = document.createElement('button'); b.textContent = 'Rückgängig'; b.onclick = () => { t.style.display = 'none'; rueck(); }; t.appendChild(b); }
  t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', rueck ? 7000 : 4500);
}
async function api(aktion, daten) {
  const r = await fetch('/api/' + aktion, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(daten || {})});
  const j = await r.json();
  if (!r.ok) { toast(j.fehler || 'Fehler', true); return null; }
