<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph-Editor</title>
<style>
:root{--bg:#f6f7f9;--pan:#fff;--tx:#1d2330;--mut:#6b7385;--lin:#dfe3ea;--akz:#2563eb;--akzb:#e3ecff;--warn:#b42318;--ok:#067647}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--pan:#1c2029;--tx:#e6e9f0;--mut:#8b93a7;--lin:#2c3240;--akz:#6b9bff;--akzb:#22305a;--warn:#ff8a80;--ok:#5fd39a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif;height:100vh;display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,1.3fr) minmax(300px,1fr);gap:10px;padding:10px}
section{background:var(--pan);border:1px solid var(--lin);border-radius:8px;display:flex;flex-direction:column;min-height:0;min-width:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0;padding:10px 12px 6px}
.scroll{overflow:auto;flex:1;padding:4px 6px 10px}
input,select,textarea,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--lin);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button:hover{border-color:var(--akz)}
textarea{width:100%;resize:vertical;min-height:34px}
.kopf{padding:0 12px 8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--lin)}
.zeile{display:flex;gap:6px;align-items:center}.zeile>input{flex:1;min-width:0}
#ntyp{flex:none!important;width:110px}
.row{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:5px;cursor:pointer;border:1px solid transparent}
.row:hover{background:var(--bg)}
.row.sel{background:var(--akzb)}
.row.ueber{border-color:var(--akz);background:var(--akzb)}
.typ{font-size:11px;color:var(--mut);background:var(--bg);border:1px solid var(--lin);border-radius:9px;padding:0 6px;white-space:nowrap}
.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zahl{color:var(--mut);font-size:12px}
.caret{width:14px;text-align:center;color:var(--mut);user-select:none}
.kinder{margin-left:16px;border-left:1px dashed var(--lin);padding-left:2px}
.leer{color:var(--mut);padding:14px 12px}
.wurzel{margin:8px 6px 0;padding:8px;border:1px dashed var(--lin);border-radius:6px;color:var(--mut);text-align:center;font-size:12px}
.wurzel.ueber{border-color:var(--akz);color:var(--akz)}
.sekt{padding:8px 12px 2px;font-size:12px;color:var(--mut)}
.rel{display:flex;gap:6px;align-items:center;padding:3px 12px}
.rel .art{color:var(--mut);font-size:12px;min-width:70px}
.rel a{flex:1;cursor:pointer;color:var(--akz);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:none;background:none;color:var(--mut);padding:0 6px}.x:hover{color:var(--warn)}
.felder{padding:0 12px;display:grid;grid-template-columns:110px 1fr;gap:4px}
#name{font-size:17px;font-weight:600;width:calc(100% - 24px);margin:10px 12px 0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9;max-width:80vw}
#toast.fehler{background:var(--warn);color:#fff}#toast button{margin-left:10px}
.hint{font-size:12px;color:var(--mut);padding:0 12px 6px}
label.chk{font-size:12px;color:var(--mut);display:flex;gap:4px;align-items:center}
@media (max-width:900px){body{grid-template-columns:1fr;height:auto}section{max-height:70vh}}
</style>
</head>
<body>

<section id="links">
  <h2>Objekte</h2>
  <div class="kopf">
    <div class="zeile">
      <input id="ntyp" list="typen" placeholder="Typ" title="Typ – neu eintippen erlaubt">
      <textarea id="nname" rows="2" placeholder="Name + Enter (mehrere Zeilen einfügen: Einrücken = darunter)" style="min-height:48px"></textarea>
    </div>
    <div class="zeile">
      <label class="chk"><input type="checkbox" id="unter"> unter die Auswahl hängen</label>
    </div>
    <div class="zeile">
      <input id="suche" placeholder="Suchen …">
      <select id="tf"></select>
    </div>
    <label class="chk"><input type="checkbox" id="lose"> nur ohne jede Beziehung</label>
  </div>
  <div class="scroll" id="liste"></div>
</section>

<section id="mitte">
  <h2>Baum</h2>
  <div class="kopf">
    <div class="zeile">
      <span class="zahl">Beziehung:</span>
      <input id="art" list="arten" placeholder="z. B. enthält">
    </div>
    <div class="hint" style="padding:0">Ziehen: auf ein Objekt = darunterhängen · im Baum = verschieben · Strg/Alt gedrückt = zusätzlich einhängen</div>
  </div>
  <div class="scroll" id="baum"></div>
</section>

<section id="rechts">
  <h2>Details</h2>
  <div class="scroll" id="detail"></div>
</section>

<datalist id="typen"></datalist>
<datalist id="arten"></datalist>
<datalist id="ziele"></datalist>
<div id="toast"></div>

<script>
let S = {knoten: [], kanten: []};
let sel = null;
const zu = new Set();               // eingeklappte Baumknoten
const $ = id => document.getElementById(id);
const ls = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d } catch (e) { return d } },
  set: (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Server ----------
let tt;
function toast(text, fehler, rueck) {
  const t = $('toast');
  t.className = fehler ? 'fehler' : '';
  t.textContent = text;
  if (rueck) { const b = document.createElement('button'); b.textContent = 'Rückgängig'; b.onclick = () => { t.style.display = 'none'; rueck(); }; t.appendChild(b); }
  t.style.display = 'block';
  clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', rueck ? 7000 : 3500);
}
async function api(aktion, daten) {
  const r = await fetch('/api/' + aktion, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(daten || {})});
  const j = await r.json();
  if (!r.ok) { toast(j.fehler || 'Fehler', true); return null; }
  S = j.zustand;
  if (sel && !byRef(sel)) sel = null;
  if (j.hinweis) toast(j.hinweis);
  render();
  return j;
}
async function laden() {
  const r = await fetch('/api/zustand'); S = (await r.json()).zustand; render();
}

// ---------- Hilfen ----------
const byRef = ref => S.knoten.find(k => k.ref === ref);
const nameVon = ref => (byRef(ref) || {name: ref}).name;
function arten() { return [...new Set(S.kanten.map(k => k.art))].sort(); }
function aktArt() { return $('art').value.trim() || 'enthält'; }
function kinderVon(ref, art) { return S.kanten.filter(k => k.gerichtet && k.art === art && k.von === ref); }
function istKind(ref, art) { return S.kanten.some(k => k.gerichtet && k.art === art && k.nach === ref); }
function hatBeziehung(ref) { return S.kanten.some(k => k.von === ref || k.nach === ref); }
function auswahl(ref) { sel = ref; render(); }

// ---------- Ziehen ----------
function ziehbar(el, daten) {
  el.draggable = true;
  el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', JSON.stringify(daten)); e.dataTransfer.effectAllowed = 'copyMove'; e.stopPropagation(); });
}
function ablage(el, beiDrop) {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('ueber'); e.stopPropagation(); });
  el.addEventListener('dragleave', () => el.classList.remove('ueber'));
  el.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation(); el.classList.remove('ueber');
    let d; try { d = JSON.parse(e.dataTransfer.getData('text/plain')); } catch (x) { return; }
    beiDrop(d, e.ctrlKey || e.altKey);
  });
}
function einhaengen(eltern, d, kopie) {
  if (d.ref === eltern) return;
  ls.set('art', aktArt());
  api('einhaengen', {eltern, kind: d.ref, art: aktArt(), alte_kante: (d.kante && !kopie) ? d.kante : null});
}

// ---------- Darstellung ----------
function zeile(k, extra) {
  const r = document.createElement('div');
  r.className = 'row' + (k.ref === sel ? ' sel' : '');
  r.innerHTML = `<span class="typ">${esc(k.typ)}</span><span class="name">${esc(k.name)}</span>`;
  r.onclick = () => auswahl(k.ref);
  return r;
}
function renderListe() {
  const q = $('suche').value.trim().toLowerCase(), tf = $('tf').value, lose = $('lose').checked;
  const L = $('liste'); L.innerHTML = '';
  const treffer = S.knoten.filter(k =>
    (!tf || k.typ === tf) && (!q || k.name.toLowerCase().includes(q)) && (!lose || !hatBeziehung(k.ref)))
    .sort((a, b) => a.typ.localeCompare(b.typ) || a.name.localeCompare(b.name, 'de'));
  if (!S.knoten.length) L.innerHTML = '<div class="leer">Noch nichts erfasst. Oben Typ und Name eintippen, Enter.</div>';
  for (const k of treffer) {
    const r = zeile(k);
    ziehbar(r, {ref: k.ref});
    ablage(r, (d, kopie) => einhaengen(k.ref, d, kopie));
    L.appendChild(r);
  }
}
function renderBaum() {
  const art = aktArt(), B = $('baum'); B.innerHTML = '';
  const wurzeln = S.knoten.filter(k => kinderVon(k.ref, art).length && !istKind(k.ref, art))
    .sort((a, b) => a.name.localeCompare(b.name, 'de'));
  if (!wurzeln.length) {
    B.innerHTML = `<div class="leer">Noch keine „${esc(art)}“-Hierarchie.<br>Ein Objekt aus der Liste links auf ein anderes ziehen, oder beim Erfassen „unter die Auswahl hängen“ ankreuzen, oder Zeilen mit Einrückung einfügen.</div>`;
    return;
  }
  const zeichne = (k, kante, pfad, ziel) => {
    const kids = kinderVon(k.ref, art), zugeklappt = zu.has(k.ref);
    const r = zeile(k);
    const c = document.createElement('span'); c.className = 'caret'; c.textContent = kids.length ? (zugeklappt ? '▸' : '▾') : '';
    c.onclick = e => { e.stopPropagation(); zugeklappt ? zu.delete(k.ref) : zu.add(k.ref); render(); };
    r.prepend(c);
    if (kids.length) r.insertAdjacentHTML('beforeend', `<span class="zahl">${kids.length}</span>`);
    ziehbar(r, {ref: k.ref, kante});
    ablage(r, (d, kopie) => einhaengen(k.ref, d, kopie));
    ziel.appendChild(r);
    if (kids.length && !zugeklappt && !pfad.includes(k.ref)) {
      const box = document.createElement('div'); box.className = 'kinder';
      for (const e of kids.sort((a, b) => nameVon(a.nach).localeCompare(nameVon(b.nach), 'de')))
        if (byRef(e.nach)) zeichne(byRef(e.nach), e.id, [...pfad, k.ref], box);
      ziel.appendChild(box);
    }
  };
  for (const w of wurzeln) zeichne(w, null, [], B);
  const wz = document.createElement('div'); wz.className = 'wurzel'; wz.textContent = 'hierher ziehen = aus dem Baum lösen';
  ablage(wz, d => { if (d.kante) api('kante_weg', {id: d.kante}); });
  B.appendChild(wz);
}
function renderDetail() {
  const D = $('detail'), k = sel && byRef(sel);
  if (!k) { D.innerHTML = '<div class="leer">Ein Objekt wählen.</div>'; return; }
  const aus = S.kanten.filter(e => e.von === k.ref), ein = S.kanten.filter(e => e.nach === k.ref);
  const felderZeilen = Object.entries(k.felder).map(([f, v]) =>
    `<input data-f="${esc(f)}" class="fk" value="${esc(f)}" readonly><input class="fv" data-f="${esc(f)}" value="${esc(v)}">`).join('');
  const relZeile = (e, richtung) => {
    const andere = richtung === 'aus' ? e.nach : e.von, pfeil = !e.gerichtet ? '—' : (richtung === 'aus' ? '→' : '←');
    return `<div class="rel"><span class="art">${pfeil} ${esc(e.art)}</span><a data-ref="${esc(andere)}">${esc(nameVon(andere))}</a><span class="typ">${esc((byRef(andere) || {}).typ || '')}</span><button class="x" data-k="${esc(e.id)}" title="Beziehung entfernen">×</button></div>`;
  };
  D.innerHTML = `
    <input id="name" value="${esc(k.name)}">
    <div class="hint" style="padding-top:2px">${esc(k.typ)}</div>
    <div class="sekt">Beziehungen</div>
    ${aus.map(e => relZeile(e, 'aus')).join('')}${ein.map(e => relZeile(e, 'ein')).join('') || ''}
    ${!aus.length && !ein.length ? '<div class="hint">Noch keine.</div>' : ''}
    <div class="rel" style="margin-top:6px">
      <input id="ra" list="arten" placeholder="Art" style="width:96px" value="${esc(aktArt())}">
      <select id="rr"><option value="aus">→ zu</option><option value="ein">← von</option><option value="ungerichtet">— mit</option></select>
      <input id="rz" list="ziele" placeholder="Objekt (Name; neu = wird angelegt) + Enter" style="flex:1;min-width:0">
    </div>
    <div class="sekt">Felder</div>
    <div class="felder">${felderZeilen}
      <input id="fn" placeholder="neues Feld"><input id="fw" placeholder="Wert + Enter">
    </div>
    <div style="padding:14px 12px"><button id="del" style="color:var(--warn)">Objekt löschen</button></div>`;
  $('name').onchange = e => api('aendern', {ref: k.ref, name: e.target.value});
  D.querySelectorAll('.fv').forEach(i => i.onchange = () => api('aendern', {ref: k.ref, felder: {[i.dataset.f]: i.value}}));
  $('fw').onkeydown = e => { if (e.key === 'Enter' && $('fn').value.trim()) api('aendern', {ref: k.ref, felder: {[$('fn').value.trim()]: $('fw').value}}); };
  D.querySelectorAll('a[data-ref]').forEach(a => a.onclick = () => auswahl(a.dataset.ref));
  D.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => api('kante_weg', {id: b.dataset.k}));
  $('del').onclick = loeschen;
  const rz = $('rz'), dl = $('ziele'); dl.innerHTML = '';
  const marken = new Map();
  for (const n of S.knoten) { if (n.ref === k.ref) continue; let m = `${n.name} · ${n.typ}`; if (marken.has(m)) m += ' · ' + n.ref; marken.set(m, n.ref); dl.insertAdjacentHTML('beforeend', `<option value="${esc(m)}">`); }
  rz.onkeydown = async e => {
    if (e.key !== 'Enter' || !rz.value.trim()) return;
    const art = $('ra').value.trim(); if (!art) { toast('Beziehungsart fehlt.', true); return; }
    let ziel = marken.get(rz.value.trim());
    if (!ziel) {   // kein Treffer: nach reinem Namen suchen, sonst neu anlegen
      const roh = rz.value.trim().toLowerCase(), t = S.knoten.filter(n => n.name.toLowerCase() === roh && n.ref !== k.ref);
      if (t.length === 1) ziel = t[0].ref;
      else if (!t.length) { const j = await api('anlegen', {typ: $('ntyp').value.trim() || 'Objekt', name: rz.value.trim()}); if (!j) return; ziel = j.ref; }
      else { toast('Name mehrdeutig – aus der Vorschlagsliste wählen.', true); return; }
    }
    ls.set('art', art);
    await api('kante', {ref: k.ref, ziel, art, richtung: $('rr').value});
    const n = $('rz'); if (n) n.focus();
  };
  ablage(D, (d) => { if (d.ref !== k.ref) api('kante', {ref: k.ref, ziel: d.ref, art: $('ra').value.trim() || aktArt(), richtung: 'aus'}); });
}
function render() {
  const tf = $('tf'), alt = tf.value, typen = [...new Set(S.knoten.map(k => k.typ))].sort();
  tf.innerHTML = '<option value="">alle Typen</option>' + typen.map(t => `<option ${t === alt ? 'selected' : ''}>${esc(t)}</option>`).join('');
  $('typen').innerHTML = typen.map(t => `<option value="${esc(t)}">`).join('');
  $('arten').innerHTML = [...new Set([...arten(), 'enthält'])].map(a => `<option value="${esc(a)}">`).join('');
  renderListe(); renderBaum();
  renderDetail();
}

// ---------- Aktionen ----------
async function erfassen() {
  const text = $('nname').value.replace(/\s+$/, '');
  if (!text.trim()) return;
  const typ = $('ntyp').value.trim() || 'Objekt', unter = $('unter').checked && sel ? sel : null;
  ls.set('typ', typ); ls.set('art', aktArt());
  const mehrzeilig = text.includes('\n') || /^\s/.test(text);
  const j = mehrzeilig
    ? await api('massen', {text, typ, art: aktArt(), unter})
    : await api('anlegen', {typ, name: text, art: aktArt(), unter});
  if (j) { $('nname').value = ''; $('nname').rows = 2; if (j.ref && !unter) sel = j.ref; render(); $('nname').focus(); }
}
function loeschen() {
  if (!sel) return;
  const ref = sel, n = nameVon(ref);
  api('loeschen', {ref}).then(j => { if (j) toast(`„${n}“ gelöscht`, false, () => api('zurueck', {ref}).then(() => auswahl(ref))); });
}

$('nname').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); erfassen(); } });
$('nname').addEventListener('input', e => { e.target.rows = Math.max(2, Math.min(8, e.target.value.split('\n').length)); });
['suche', 'tf', 'lose'].forEach(i => $(i).addEventListener('input', renderListe));
$('art').addEventListener('input', () => { renderBaum(); });
$('art').addEventListener('change', () => ls.set('art', aktArt()));
document.addEventListener('keydown', e => {
  if (e.key === 'Delete' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) loeschen();
});

$('ntyp').value = ls.get('typ', '');
$('art').value = ls.get('art', 'enthält');
$('unter').checked = ls.get('unter', '') === '1';
$('unter').onchange = () => ls.set('unter', $('unter').checked ? '1' : '');
laden().then(() => $('nname').focus());
</script>
</body>
</html>
