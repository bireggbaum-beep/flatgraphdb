[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flatgraph"
version = "4.5.3"
description = "A graph database in a single Python file: plain JSON on disk, crash-safe writes, standard library only"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "bireggbaum-beep"}]
keywords = ["graph", "database", "embedded", "json", "file-based"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Database :: Database Engines/Servers",
]

[tool.setuptools]
py-modules = ["flatgraph"]
